[package]
name = "s75_led_studio"
version = "0.2.1"
edition = "2021"

[dependencies]
eframe = "0.29"
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
